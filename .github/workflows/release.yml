name: Release

# Runs only after Test succeeds on a push to main, so a release is never cut from a
# red commit. Pending changesets open the "Version Packages" PR; merging it publishes
# to npm via OIDC trusted publishing (provenance, no NPM_TOKEN) and pushes the tag.
# The npm trusted publisher is configured against this filename (release.yml).
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}

permissions:
  contents: write # version-bump commit + release tag
  pull-requests: write # the Version Packages PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release:
    # Only a successful, push-triggered Test run (PR runs are filtered by `branches`).
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # OIDC needs Node > 22; its bundled npm supports OIDC
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Skips a pointless changesets/action run when there's nothing to do. This was
      # load-bearing on changesets 2.31.0, which detected an already-published version
      # by string-matching npm's stderr and hard-failed when that missed; 3.x returns a
      # structured already-published result and skips past it, so this is now only an
      # optimisation. Note the glob doesn't cover .changeset/pre/ (3.x prerelease mode).
      - name: Is there anything to release?
        id: rel
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv '/README\.md$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # pending changesets -> Version PR
          elif node -e "const p=require('./package.json'); fetch('https://registry.npmjs.org/'+p.name+'/'+p.version).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
            echo "run=false" >> "$GITHUB_OUTPUT"  # already on npm -> nothing to do
          else
            echo "run=true" >> "$GITHUB_OUTPUT"   # new version -> publish
          fi

      # Must stay on v2 while @changesets/cli is 3.x. v1 found published packages by
      # regex-scanning publish stdout for `New tag: <pkg>@<version>`; the 3.x clack
      # output prints `Successfully published:` with the package on the next line, so
      # v1 matched nothing, pushed no tags and cut no GitHub releases, while still
      # exiting 0. v2 reads the CHANGESETS_OUTPUT NDJSON file instead. It also renamed
      # the inputs, and takes the token as an input (defaulting to github.token).
      - name: Version PR or publish
        if: steps.rel.outputs.run == 'true'
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: true
